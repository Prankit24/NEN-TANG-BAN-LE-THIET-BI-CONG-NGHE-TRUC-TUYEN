name: EMUA CI/CD Docker

on:
  push:
    branches:
      - main
      - PhuongAnh

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build EMUA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore packages
        run: dotnet restore EMua/EMua.csproj

      - name: Build Release
        run: |
          dotnet build EMua/EMua.csproj \
            --configuration Release \
            --no-restore

  docker:
    name: Verify Docker Image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: emua:ci

  deploy:
    name: Deploy EMUA to Render
    needs:
      - build
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "Thiếu secret RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi

          echo "Đang gửi yêu cầu triển khai đến Render..."

          curl --fail-with-body --silent --show-error \
            --connect-timeout 20 \
            --max-time 90 \
            --request POST "$RENDER_HOOK"

          printf '\nĐã gửi yêu cầu triển khai đến Render.\n'